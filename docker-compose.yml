services:
  heavywater:
    image: ghcr.io/destinationhome/game-heavywater:latest
    container_name: game-heavywater
    restart: unless-stopped
    user: "1002:1002"
    volumes:
      - /srv/destinationhome/private/heavywater/data:/app/data
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://172.17.0.1:4318
      - PORT=3000
    ports:
      - "30082:3000"
